approval_request:
  title: "Add Supervisor lint for incomplete approval requests"
  user_facing_change: "The Handoff Supervisor would flag approval-waiting Packets that do not tell the user what is changing, what choices are available, or what response sentence to use."
  gameplay_or_workflow_intent: "Make approval waits more reliable so the user can judge approve/reject/scope-modify decisions from Dashboard and the linked request document."
  proposed_behavior: "When a Packet is WaitingUserApproval, Supervisor checks the linked approval request document for substantive decision content and reports missing pieces as consistency issues."
  data_changes: "No gameplay data or JSON schema changes."
  code_changes: "Potentially modify tools/aiworkflow/handoff_supervisor.ps1 only after approval."
  files_expected_to_change: "tools/aiworkflow/handoff_supervisor.ps1; _Docs/Handoff/Handoff_Supervisor_MVP.md; _Docs/Handoff/Handoff_Supervisor_MVP_KR.md; _DevLog/WorkLog/."
  non_goals: "No game source changes; no gameplay JSON; no runtime behavior; no assets; no build settings; no automatic approval; no automatic Done; no commit or push automation."
  risks: "A too-strict lint rule could create noisy false positives. The implementation must keep the check narrow and document-only."
  validation_plan: "Run handoff_supervisor status/write-docs against valid and intentionally incomplete document-only approval requests; confirm Dashboard and Violations output."
  decision_needed: "User should approve, reject, or modify the proposed Supervisor lint implementation scope."

